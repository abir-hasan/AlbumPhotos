name: Ktlint

on:
  pull_request:

# Cancel in-progress runs for the same PR when new commits are pushed.
concurrency:
  group: ktlint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ktlint:
    name: Run ktlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # --continue so every module is checked and all violations are reported
      # in a single run, instead of stopping at the first failing module.
      - name: Run ktlintCheck
        run: ./gradlew ktlintCheck --continue

      - name: Upload ktlint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ktlint-reports
          path: '**/build/reports/ktlint/'
          if-no-files-found: ignore
